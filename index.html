<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>marugoto_theater</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <!-- 固定ヘッダー（必要なら中身を足してOK） -->
  <header class="site-header" role="banner" aria-label="サイトヘッダー"></header>

  <!-- メイン（ヘッダー高さ分の余白はCSSで付与） -->
  <main id="main" class="site-main" role="main">
    <!-- ヒーロー（画像 + 黒オーバーレイ + 中央テキスト） -->

    <section class="hero" aria-label="メインビジュアル">
      <img
        class="hero__img"
        src="photo/jason-an-8QKgmzoSp0g-unsplash.jpg"
        alt="神山の風景"
        loading="eager"
        decoding="async"
      >
      <div class="hero__overlay" aria-hidden="true"></div>
      <h1 class="hero__title">
        神山まるごと高専の<br>"日常"<br>をまるごと体験
      </h1>
    </section>

    <!-- 以降、コンテンツ -->
    <!-- <section class="container">...</section> -->

    <section class="scenario">
        <h1 class="main-title">
            <span class="line1">「あなたは今から</span><br>
            <span class="line2">神山まるごと高専生」</span>
        </h1>
        <p>会議室の中では、</p>
        <p>あなたの先輩や同級生が談笑しています。</p>
        <p>先輩たちは、各々のプロジェクトや授業、</p>
        <p>じつはちょっと恋の話なんかもしているみたい。</p>
        <p>これから5年間この学校で過ごすあなたは、</p>
        <p>一日でも早く先輩たちと仲良くなりたい。</p>
        <p>ちょっと緊張するけれど、話しかけて、 </p>
        <p>時にはお手伝いをしてみよう。</p>
        <p>これは、ちょっとのんびりなある日の、</p>
        <p>神山まるごと高専の学生たちの姿。</p>

    </section>

    <section class="images">
      <img src="photo/airfocus-K_VeavYEfdA-unsplash-removebg-preview.png" alt="cast image1">
      <img class="right" src="photo/product-school-DL-yyYDDNX4-unsplash-removebg-preview.png" alt="">
      <img class="friends" src="photo/simon-maage-tXiMrX3Gc-g-unsplash-removebg-preview.png" alt="">
    </section>

    <section class="casts">
      <h1>Cast</h1>

      <div class="casts_image">
        
      </div>
    </section>
  </main>
</body>
</html>
